services:
  patch-tuesday:
    build: .
    container_name: patch-tuesday
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      # Mount host SSH key so the app can authenticate to containers via SSH
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    environment:
      - TZ=America/New_York
      # Do NOT add PTU_LOCAL_HOSTS for the LXC this container lives on:
      # "local" execution runs inside this container and would patch the
      # container's own packages, not the LXC's. Leave that entry out of
      # the list so it is patched over SSH instead — the app user's key
      # must be in the LXC's ~/.ssh/authorized_keys for that to work.
      # (PTU_LOCAL_HOSTS is for native deployments where hostname/IP
      # auto-detection misses the host's address.)
