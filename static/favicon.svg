<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#151523"/>
    </linearGradient>
    <linearGradient id="wrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#333" stroke-width="1"/>

  <!-- Wrench -->
  <g transform="translate(32,32) rotate(-45) scale(1.4)">
    <!-- Handle -->
    <rect x="-2.5" y="-8" width="5" height="20" rx="1" fill="url(#wrench)"/>

    <!-- Head (C shape) -->
    <path d="M-5,-16 L5,-16 L5,-12 L-5,-12 Z" fill="url(#wrench)"/>
    <path d="M-9,-14 C-9,-18 -4,-20 0,-20 C4,-20 9,-18 9,-14 L7,-12 C7,-15.5 4.5,-17.5 0,-17.5 C-4.5,-17.5 -7,-15.5 -7,-12 Z" fill="url(#wrench)"/>
    <path d="M-9,6 C-9,2 -4,0 0,0 C4,0 9,2 9,6 L7,8 C7,4.5 4.5,2.5 0,2.5 C-4.5,2.5 -7,4.5 -7,8 Z" fill="url(#wrench)"/>

    <!-- Holes in head -->
    <circle cx="-2" cy="-16" r="1" fill="#1e1e2e" opacity="0.3"/>
    <circle cx="2" cy="4" r="1" fill="#1e1e2e" opacity="0.3"/>
  </g>
</svg>
